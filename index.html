  <!-- Handschrift-Fonts (wie im Widget) -->

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Patrick Hand', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #b8e3f5 0%, #d6eef7 55%, #e8f4d8 100%);
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Berg-Panorama als Hintergrund — skaliert mit der Breite, wird nie abgeschnitten */
    .mountains {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: auto;
      z-index: 0;
      pointer-events: none;
      display: block;
    }

    .landing {
      position: relative;
      z-index: 2;
      padding: 30px;
      margin-bottom: 6vh;
    }
    .landing h1 {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(44px, 9vw, 76px);
      color: #2c3e50;
      text-shadow: 3px 3px 0 #ffd166;
      line-height: 1;
      margin: 0 0 18px;
    }
    .landing .subtitle {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(22px, 4.5vw, 32px);
      color: #5a7a8a;
      background: white;
      display: inline-block;
      padding: 6px 26px;
      border-radius: 30px;
      border: 3px solid #2c3e50;
      box-shadow: 4px 4px 0 #5a7a8a;
      margin-bottom: 28px;
    }
    .landing .hint {
      font-size: 19px;
      color: #5a7a8a;
      margin: 0 0 24px;
    }

    /* Impressum-Fußzeile */
    .impressum {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 3;
      padding: 6px 14px;
      font-size: 10px;
      line-height: 1.35;
      color: #3a5563;
      background: rgba(255,255,255,0.7);
      text-align: center;
    }
    .impressum strong { color: #2c3e50; }
  </style>
